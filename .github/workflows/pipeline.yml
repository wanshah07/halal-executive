name: Pipeline
# Pipeline jobs. Each one runs until its queue is empty and logs the provider
# that answered (MIRELD or AFIQ) to the Runs tab. Started by Apps Script's
# timer or by Admin → Run the AI now; overlapping starts queue (concurrency).
#
# Repository secrets: HE_API_URL, HE_INGEST_TOKEN, MIRELD_API_KEY, AFIQ_API_KEY
# Repository variables (all optional): MIRELD_MODEL, AFIQ_MODEL (empty = auto), NEWS_FEEDS
on:
  # No GitHub cron: on this repo it fired twice in ten hours. Apps Script's
  # time-driven triggers start every run through workflow_dispatch
  # (apps-script/Code.gs, installTriggers): process_whatsapp every 30 min,
  # references review every 3 h, news every 6 h, facebook ~2 am and
  # organise ~3 am MYT. CLAUDE.md rule 14.
  workflow_dispatch:
    inputs:
      job:
        description: process_whatsapp | process_facebook | news | organise | references | sahkan
        default: process_whatsapp
permissions: { contents: read }
concurrency: { group: pipeline, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HE_API_URL: ${{ secrets.HE_API_URL }}
      HE_INGEST_TOKEN: ${{ secrets.HE_INGEST_TOKEN }}
      MIRELD_API_KEY: ${{ secrets.MIRELD_API_KEY }}
      AFIQ_API_KEY: ${{ secrets.AFIQ_API_KEY }}
      MIRELD_MODEL: ${{ vars.MIRELD_MODEL }}
      AFIQ_MODEL: ${{ vars.AFIQ_MODEL }}
      NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
      MIRELD_TIMEOUT: '45'
      STATE_DIR: ${{ github.workspace }}/.state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r pipeline/requirements.txt
      - run: mkdir -p .state
      - name: Restore provider turn counter
        uses: actions/cache@v4
        with:
          path: .state
          key: llm-turn-${{ github.run_id }}
          restore-keys: llm-turn-
      - name: Pick job
        id: pick
        run: |
          j="${{ github.event.inputs.job }}"
          if [ -z "$j" ]; then
            case "${{ github.event.schedule }}" in
              '10,40 * * * *') j=process_whatsapp ;;
              '55 18 * * *')  j=process_facebook ;;
              '25 */6 * * *') j=news ;;
              '50 19 * * *')  j=organise ;;
            esac
          fi
          echo "job=$j" >> "$GITHUB_OUTPUT"
      - name: Run
        working-directory: pipeline
        run: |
          case "${{ steps.pick.outputs.job }}" in
            process_whatsapp) python process_raw.py --source whatsapp,telegram,manual; a=$?; python drive_organiser.py; b=$?; python index_references.py; c=$?; python resolve_sahkan.py; d=$?; exit $(( a || b || c || d )) ;;
            process_facebook) python process_raw.py --source facebook; a=$?; python resolve_sahkan.py; b=$?; exit $(( a || b )) ;;
            news)             python news_sweep.py ;;
            organise)         python drive_organiser.py ;;
            references)       python index_references.py --audit; a=$?; python resolve_sahkan.py; b=$?; exit $(( a || b )) ;;
            sahkan)           python resolve_sahkan.py ;;
            *) echo "unknown job"; exit 1 ;;
          esac
