name: Pipeline
run-name: ${{ inputs.job || 'process_whatsapp' }}
# Pipeline jobs. Each one runs until its queue is empty and logs the provider
# that answered (MIRELD or AFIQ) to the Runs tab. Started by Apps Script's
# timer or by Admin → Run the AI now; overlapping starts queue (concurrency).
#
# Repository secrets: HE_API_URL, HE_INGEST_TOKEN, MIRELD_API_KEY, AFIQ_API_KEY
# Repository variables (all optional): MIRELD_MODEL, AFIQ_MODEL (empty = auto), NEWS_FEEDS
on:
  # No GitHub cron: on this repo it fired twice in ten hours. Apps Script's
  # time-driven triggers start every run through workflow_dispatch
  # (apps-script/Code.gs, installTriggers): process_whatsapp every 30 min,
  # references review every 3 h, news every 6 h, facebook ~2 am and
  # organise ~3 am MYT. CLAUDE.md rule 14.
  workflow_dispatch:
    inputs:
      job:
        description: process_whatsapp | uploads | bench | process_facebook | news | organise | references | sahkan
        default: process_whatsapp
permissions: { contents: read, actions: write }  # actions: start the uploads lane
# Uploads and filing have their own lane, so a certificate uploaded in Admin
# is read and filed in minutes instead of waiting behind a 45-minute backlog
# run. Only the files lane runs drive_organiser, so two runs never file the
# same document.
concurrency: { group: "${{ (inputs.job == 'uploads' || inputs.job == 'organise' || inputs.job == 'bench') && 'files' || 'pipeline' }}", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HE_API_URL: ${{ secrets.HE_API_URL }}
      HE_INGEST_TOKEN: ${{ secrets.HE_INGEST_TOKEN }}
      MIRELD_API_KEY: ${{ secrets.MIRELD_API_KEY }}
      AFIQ_API_KEY: ${{ secrets.AFIQ_API_KEY }}
      MIRELD_MODEL: ${{ vars.MIRELD_MODEL }}
      AFIQ_MODEL: ${{ vars.AFIQ_MODEL }}
      NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
      MIRELD_TIMEOUT: '45'
      STATE_DIR: ${{ github.workspace }}/.state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r pipeline/requirements.txt
      - run: mkdir -p .state
      - name: Restore provider turn counter
        uses: actions/cache@v4
        with:
          path: .state
          key: llm-turn-${{ github.run_id }}
          restore-keys: llm-turn-
      - name: Pick job
        id: pick
        run: |
          j="${{ github.event.inputs.job }}"
          echo "job=${j:-process_whatsapp}" >> "$GITHUB_OUTPUT"
      # Phase by phase, like the KKM complaints routine: each phase has its own
      # time box, reports to Admin → Progress when it starts and ends, and a
      # phase that fails or runs out of time never stops the ones after it.
      # Whatever a phase did not finish, the next 30-minute run picks up.
      - name: Run
        working-directory: pipeline
        shell: bash
        run: |
          JOB="${{ steps.pick.outputs.job }}"; RC=0; rm -f "$STATE_DIR/more_waiting"
          phase() {  # phase <minutes> <name> <command...>
            local min=$1 name=$2; shift 2
            python phase.py "$JOB" running "$name: started" || true
            if timeout --signal=INT --kill-after=60 "${min}m" "$@"; then
              python phase.py "$JOB" done "$name: finished" || true
            else
              local c=$?; RC=1
              if [ $c -eq 124 ] || [ $c -eq 130 ]; then msg="stopped at its ${min}-minute limit; the next run carries on"; else msg="failed (exit $c); see the GitHub log"; fi
              python phase.py "$JOB" failed "$name: $msg" || true
            fi
          }
          case "$JOB" in
            process_whatsapp)
              # Start the files lane first (Admin uploads, certificates): it runs
              # beside this one and is done in minutes.
              GH_TOKEN="${{ github.token }}" gh workflow run pipeline.yml --repo "${{ github.repository }}" --ref main -f job=uploads && python phase.py "$JOB" running "uploads lane started" || python phase.py "$JOB" failed "could not start the uploads lane"
              phase 24 "Read group messages" python process_raw.py --source whatsapp,telegram --attachments none --minutes 20
              phase 6  "Merge repeated FAQ" python dedupe_faq.py
              phase 10 "Read new references" python index_references.py
              phase 6  "Fill SAHKAN from references" python resolve_sahkan.py ;;
            process_facebook)
              phase 24 "Read Facebook posts" python process_raw.py --source facebook --minutes 20
              phase 6  "Fill SAHKAN from references" python resolve_sahkan.py ;;
            uploads)
              phase 10 "Read Admin uploads and group files" python process_raw.py --source manual,whatsapp,telegram --attachments only --minutes 8
              phase 10 "File documents and certificates" python drive_organiser.py ;;
            news)       phase 20 "Halal news" python news_sweep.py ;;
            organise)   phase 30 "Drive organiser" python drive_organiser.py ;;
            references)
              phase 40 "Review references" python index_references.py --audit
              phase 10 "Fill SAHKAN from references" python resolve_sahkan.py ;;
            bench)      phase 10 "Time MIRELD and AFIQ" python llm_router.py --bench ;;
            sahkan)     phase 20 "Fill SAHKAN from references" python resolve_sahkan.py ;;
            *) echo "unknown job"; exit 1 ;;
          esac
          python phase.py "$JOB" $([ $RC -eq 0 ] && echo done || echo failed) "run finished" || true
          # Backlog: a run that stopped at its time limit with messages still
          # waiting starts the next one now instead of waiting for the timer.
          # Only when it read something, so a provider outage cannot loop.
          if [ "$JOB" = process_whatsapp ] && [ "$(cat "$STATE_DIR/more_waiting" 2>/dev/null)" = 1 ]; then
            GH_TOKEN="${{ github.token }}" gh workflow run pipeline.yml --repo "${{ github.repository }}" --ref main -f job=process_whatsapp && python phase.py "$JOB" running "more messages waiting: next run started" || true
          fi
          exit $RC
