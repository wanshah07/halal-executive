name: Deploy site
# Builds the Vite page and publishes it to GitHub Pages at
# halalexecutive.kkmhalalconsultant.com (public/CNAME). The Pages site must
# exist first: Settings → Pages → Source: GitHub Actions (the workflow token
# cannot create it, tried 14 Oct 2026). Then add the DNS record in SETUP.md. Only this repository publishes this site.
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'package*.json', 'vite.config.js', '.github/workflows/deploy.yml']
  workflow_dispatch:
  # Refresh the data snapshot (dist/data.json) after every pipeline run.
  workflow_run:
    workflows: [Pipeline]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Say which Sheet the build reads
        run: if [ -n "$VITE_API_URL" ]; then echo "Building against the live Sheet"; else echo "::warning::VITE_API_URL is empty, the page will run on sample data"; fi
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || secrets.HE_API_URL }}
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || secrets.HE_API_URL }}
          VITE_SHEET_URL: ${{ vars.VITE_SHEET_URL || secrets.VITE_SHEET_URL }}
          VITE_DRIVE_FOLDER_URL: ${{ vars.VITE_DRIVE_FOLDER_URL || secrets.VITE_DRIVE_FOLDER_URL }}
      - name: Snapshot the public feed next to the page
        # The page shows this at once on a first visit while the live feed
        # (Apps Script, a few seconds) loads. Same content as action=data.
        run: |
          [ -n "$VITE_API_URL" ] || exit 0
          if curl -sfL --max-time 60 "$VITE_API_URL?action=data" -o dist/data.json && python3 .github/scrub_feed.py dist/data.json; then
            echo "snapshot: $(wc -c < dist/data.json) bytes"
          else
            rm -f dist/data.json; echo "::warning::could not snapshot the feed; the page will wait for the live feed"
          fi
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || secrets.HE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
