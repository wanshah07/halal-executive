name: Deploy site
# Builds the Vite page and publishes it to GitHub Pages at
# halalexecutive.kkmhalalconsultant.com (public/CNAME). Repository →
# Settings → Pages → Source: GitHub Actions, then add the DNS record in
# SETUP.md. Only this repository publishes this site.
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'package*.json', 'vite.config.js', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SHEET_URL: ${{ vars.VITE_SHEET_URL }}
          VITE_DRIVE_FOLDER_URL: ${{ vars.VITE_DRIVE_FOLDER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
